<!DOCTYPE html>
<html>

<head>

    <section class="text-center pt-3">

                    <h5>Pizaa</h5>

                </div>
            </article>

            <article class="col-md-4">
                <div class="card p-5">
                    <h5>Burger </h5>
                    <p>120 RS</p>
                </div>
            </article>
            <article class="col-md-4">
                <div class="card p-5">
                    <h5>Pasta </h5>
                    <p>100 RS</p>
                </div>
            </article>

            <article class="col-md-4">
                <div class="card p-5">

                </div>
            </article>

            <article class="col-md-4">
                <div class="card p-5">
                    <h5>Garlic Bread </h5>
                    <p>70 RS</p>
                </div>
            </article>
            <article class="col-md-4">
                <div class="card p-5">
                    <h5>Fried Rice </h5>
                    <p>100 RS</p>
                </div>
            </article>

            <article class="col-md-4">
                <div class="card p-5">
                    <h5>Chocolate Brownie</h5>
                    <p>150 RS</p>
                </div>
            </article>

            <article class="col-md-4">
                <div class="card p-5">
                    <h5>Fresh Juice </h5>
                    <p>50 RS</p>
                </div>
            </article>
            <article class="col-md-4">
                <div class="card p-5">
                    <h5>Milkshake </h5>
                    <p>60 RS</p>
                </div>
            </article>
        </div>
         <br>
        

    </section>

    <footer class="bg-dark text-center p-3">
        <p class="text-white w-100"> 2026 Foodie </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
